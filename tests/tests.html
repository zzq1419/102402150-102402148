<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单元测试报告 · 校园失物招领</title>
<style>
  :root{--green:#07C160;--red:#E5484D;--ink:#1A1D21;--ink2:#5A6169;--ink3:#9AA1AA;--line:#EDEFF2}
  *{box-sizing:border-box}
  body{
    margin:0;padding:28px 16px 60px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#F5F6F8;color:var(--ink);font-size:14px;line-height:1.6;
  }
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:var(--ink2);font-size:13px;margin:0 0 6px}
  .cmd{
    background:#1A1D21;color:#D7E3EA;border-radius:10px;
    padding:11px 14px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;
    margin:14px 0 20px;overflow-x:auto;
  }
  .stat{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .stat div{
    background:#fff;border-radius:12px;padding:14px 22px;box-shadow:0 2px 10px rgba(20,30,50,.06);
    text-align:center;min-width:110px;
  }
  .stat b{display:block;font-size:24px;line-height:1.2}
  .stat span{font-size:12px;color:var(--ink3)}
  .pass b{color:var(--green)} .fail b{color:var(--red)}
  .banner{border-radius:12px;padding:14px 18px;font-weight:600;margin-bottom:20px}
  .banner.ok{background:#E8F8EF;color:#059E4E}
  .banner.bad{background:#FEECEC;color:#C0353A}
  .group{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(20,30,50,.06);
         margin-bottom:14px;overflow:hidden}
  .group h2{
    margin:0;font-size:14px;padding:12px 16px;background:#FAFBFC;
    border-bottom:1px solid var(--line);font-weight:600;
  }
  .case{display:flex;gap:20px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  .case:last-child{border-bottom:0}
  .case .mark{flex:none;width:46px;font-weight:700}
  .case.pass .mark{color:var(--green)}
  .case.fail .mark{color:var(--red)}
  .case .msg{color:var(--red);font-size:12.5px;margin-top:3px;font-family:ui-monospace,Consolas,monospace;
             word-break:break-all}
  footer{margin-top:26px;color:var(--ink3);font-size:12.5px;text-align:center;line-height:1.9}
  code{background:#EDEFF2;padding:1px 5px;border-radius:4px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>校园失物招领 · 单元测试报告</h1>
  <p class="sub">测试对象：<code>js/utils.js</code> 的纯函数（搜索筛选、表单校验、时间格式化、业务小工具）
     ＋ <code>js/ui.js</code> 的视图产物冒烟检查。
     <br>同一份用例也可以在命令行跑，方便每日构建：</p>
  <div class="cmd">node tests/unit.test.js</div>

  <div class="stat">
    <div><b id="s-total">–</b><span>用例总数</span></div>
    <div class="pass"><b id="s-pass">–</b><span>通过</span></div>
    <div class="fail"><b id="s-fail">–</b><span>失败</span></div>
  </div>

  <div id="banner" class="banner ok">正在运行…</div>
  <div id="groups"></div>

  <footer>
    测试文件：<code>tests/unit.test.js</code><br>
    被测文件：<code>js/utils.js</code>（纯函数）、<code>js/ui.js</code>（视图产物冒烟）、<code>js/data.js</code>（常量）
  </footer>
</div>

<script src="../js/data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/ui.js"></script>
<script src="unit.test.js"></script>
<script>
(function () {
  var T = window.LFTests;
  var s = T.summary();

  document.getElementById('s-total').textContent = s.total;
  document.getElementById('s-pass').textContent  = s.pass;
  document.getElementById('s-fail').textContent  = s.fail;

  var banner = document.getElementById('banner');
  banner.className = 'banner ' + (s.fail === 0 ? 'ok' : 'bad');
  banner.textContent = s.fail === 0
    ? '✅ 全部通过（' + s.total + '/' + s.total + '）'
    : '❌ 有 ' + s.fail + ' 个用例失败，请查看下面的红色条目';

  /* 按 [分组名] 归类展示 */
  var buckets = {}, order = [];
  s.results.forEach(function (r) {
    var m = /^\[(.+?)\]\s*(.*)$/.exec(r.name);
    var g = m ? m[1] : '其他';
    var n = m ? m[2] : r.name;
    if (!buckets[g]) { buckets[g] = []; order.push(g); }
    buckets[g].push({ name: n, ok: r.ok, msg: r.msg });
  });

  var host = document.getElementById('groups');
  var html = '';
  order.forEach(function (g) {
    html += '<div class="group"><h2>' + g + '（' +
      buckets[g].filter(function (x) { return x.ok; }).length + '/' + buckets[g].length +
      '）</h2>';
    buckets[g].forEach(function (c) {
      html += '<div class="case ' + (c.ok ? 'pass' : 'fail') + '">'
        + '<span class="mark">' + (c.ok ? '✓ 通过' : '✗ 失败') + '</span>'
        + '<span>' + escapeHtml(c.name)
        + (c.ok ? '' : '<div class="msg">' + escapeHtml(c.msg || '') + '</div>')
        + '</span></div>';
    });
    html += '</div>';
  });
  host.innerHTML = html;

  function escapeHtml(x) {
    return String(x == null ? '' : x)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>
</body>
</html>
